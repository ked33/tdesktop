name: Build Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 720

    env:
      BUILD_PATH: D:\TBuild

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare build folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:BUILD_PATH" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:BUILD_PATH\ThirdParty" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:BUILD_PATH\Libraries" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:BUILD_PATH\Libraries\win64" | Out-Null
          New-Item -ItemType Junction -Path "$env:BUILD_PATH\tdesktop" -Target "$env:GITHUB_WORKSPACE" | Out-Null

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            D:\TBuild\ThirdParty
            D:\TBuild\Libraries
          key: win64-deps-${{ hashFiles('Telegram/build/prepare/**') }}
          restore-keys: |
            win64-deps-

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare third-party libraries
        shell: cmd
        run: |
          cd /d %BUILD_PATH%
          tdesktop\Telegram\build\prepare\win.bat

      - name: Configure project
        shell: cmd
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if "%TDESKTOP_API_ID%"=="" exit /b 1
          if "%TDESKTOP_API_HASH%"=="" exit /b 1
          cd /d %BUILD_PATH%\tdesktop\Telegram
          configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

      - name: Build Telegram (Release)
        shell: cmd
        run: |
          cd /d %BUILD_PATH%\tdesktop\out
          cmake --build . --config Release --target Telegram --parallel

      - name: Package artifacts
        shell: pwsh
        run: |
          $outDir = "$env:BUILD_PATH\tdesktop\out\Release"
          $pkgDir = "$env:BUILD_PATH\tdesktop\out\artifacts"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item -Path "$outDir\Telegram.exe" -Destination $pkgDir
          $updaterPath = "$outDir\Updater.exe"
          if (-not (Test-Path $updaterPath)) {
            $foundUpdater = Get-ChildItem -Path $outDir -Recurse -Filter Updater.exe -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($foundUpdater) {
              $updaterPath = $foundUpdater.FullName
            }
          }
          if (Test-Path $updaterPath) {
            Copy-Item -Path $updaterPath -Destination $pkgDir
          } else {
            Write-Host "Updater.exe not found; skipping."
          }
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "$env:BUILD_PATH\tdesktop\out\Telegram-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-x64
          path: |
            D:\TBuild\tdesktop\out\artifacts\*
            D:\TBuild\tdesktop\out\Telegram-x64.zip
