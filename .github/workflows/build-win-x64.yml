name: Build Windows x64

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 720
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      SCCACHE_IDLE_TIMEOUT: "0"

    steps:
      - name: Prepare directories
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'TBuild'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'ThirdParty') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Libraries') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'Libraries\win64') | Out-Null
          "TBUILD=$root" >> $env:GITHUB_ENV
          "TBUILD_REL=TBuild" >> $env:GITHUB_ENV
          "LibrariesPath=$(Join-Path $root 'Libraries\win64')" >> $env:GITHUB_ENV

      - name: Get repository name
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
          path: ${{ env.TBUILD_REL }}/${{ env.REPO_NAME }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Compute cache key
        shell: bash
        run: |
          PREPARE_ROOT="$GITHUB_WORKSPACE/$TBUILD_REL/$REPO_NAME/Telegram/build/prepare"
          DOC_PATH="$GITHUB_WORKSPACE/$TBUILD_REL/$REPO_NAME/docs/building-win.md"
          {
            find "$PREPARE_ROOT" -type f -print0 | sort -z | xargs -0 sha256sum
            if [ -f "$DOC_PATH" ]; then
              sha256sum "$DOC_PATH"
            fi
          } > CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

      - name: Restore third-party cache
        id: cache_third_party
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: win64-third-party-${{ env.CACHE_KEY }}
          restore-keys: |
            win64-third-party-

      - name: Restore libraries cache
        id: cache_libraries
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: win64-libs-release-${{ env.CACHE_KEY }}
          restore-keys: |
            win64-libs-release-
            win64-libs-${{ env.CACHE_KEY }}

      - name: Restore Qt cache
        id: cache_qt
        uses: actions/cache/restore@v5
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: win64-qt-release-${{ env.CACHE_KEY }}
          restore-keys: |
            win64-qt-release-
            win64-qt-${{ env.CACHE_KEY }}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
        with:
          version: "v0.15.0"

      - name: Configure MSVC environment
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" exit /b 1
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALLPATH=%%i"
          if not defined VSINSTALLPATH exit /b 1
          call "%VSINSTALLPATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          echo Platform=x64>>"%GITHUB_ENV%"
          for /f "delims=" %%i in ('set') do @echo %%i>>"%GITHUB_ENV%"

      - name: Check supplemental search progress, merging and limits
        shell: cmd
        run: |
          cl /nologo /std:c++20 /EHsc /W4 /WX ^
            /I"%TBUILD%\%REPO_NAME%\Telegram\SourceFiles" ^
            "%TBUILD%\%REPO_NAME%\Telegram\SourceFiles\test\test_porn_search.cpp" ^
            /Fe:"%RUNNER_TEMP%\test_porn_search.exe" ^
            /Fo:"%RUNNER_TEMP%\test_porn_search.obj"
          if errorlevel 1 exit /b %errorlevel%
          "%RUNNER_TEMP%\test_porn_search.exe"
          exit /b %errorlevel%

      - name: NuGet sources
        shell: cmd
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Prepare third-party libraries
        id: prepare_libraries
        shell: cmd
        run: |
          cd /d %TBUILD%
          %REPO_NAME%\Telegram\build\prepare\win.bat silent

      - name: Save third-party cache
        if: steps.prepare_libraries.outcome == 'success' && steps.cache_third_party.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ steps.cache_third_party.outputs.cache-primary-key }}

      - name: Save libraries cache
        if: steps.prepare_libraries.outcome == 'success' && steps.cache_libraries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache_libraries.outputs.cache-primary-key }}

      - name: Save Qt cache
        if: steps.prepare_libraries.outcome == 'success' && steps.cache_qt.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ steps.cache_qt.outputs.cache-primary-key }}

      - name: Configure project
        shell: cmd
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if "%TDESKTOP_API_ID%"=="" exit /b 1
          if "%TDESKTOP_API_HASH%"=="" exit /b 1
          cd /d %TBUILD%\%REPO_NAME%\Telegram
          configure.bat -G "Ninja Multi-Config" ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -DCMAKE_CONFIGURATION_TYPES=Release ^
            -D DESKTOP_APP_NO_PDB=ON ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT= ^
            -D CMAKE_C_COMPILER_LAUNCHER=sccache ^
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build Telegram (Release)
        shell: cmd
        run: |
          cd /d %TBUILD%\%REPO_NAME%\out
          cmake --build . --config Release --target Telegram --parallel

      - name: Show sccache statistics
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          $sccache = $env:SCCACHE_PATH
          if (-not $sccache) {
            $cmd = Get-Command sccache -ErrorAction SilentlyContinue
            if ($cmd) { $sccache = $cmd.Source }
          }
          if (-not $sccache) {
            Write-Host "sccache not available; skipping statistics"
            exit 0
          }
          & $sccache --show-stats
          exit 0

      - name: Package artifact
        shell: pwsh
        run: |
          $exe = "$env:TBUILD\$env:REPO_NAME\out\Release\Telegram.exe"
          if (-not (Test-Path -LiteralPath $exe)) { exit 1 }
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifact'
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $artifactDir 'Telegram.exe')

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Telegram-x64
          path: artifact/
          if-no-files-found: error
