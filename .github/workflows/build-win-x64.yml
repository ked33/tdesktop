name: Build Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 720

    env:
      BUILD_PATH: D:\TBuild

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare build folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:BUILD_PATH" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:BUILD_PATH\ThirdParty" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:BUILD_PATH\Libraries" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:BUILD_PATH\Libraries\win64" | Out-Null
          New-Item -ItemType Junction -Path "$env:BUILD_PATH\tdesktop" -Target "$env:GITHUB_WORKSPACE" | Out-Null

      - name: Cache third-party
        uses: actions/cache@v4
        with:
          path: D:\TBuild\ThirdParty
          key: win64-third-party-${{ hashFiles('Telegram/build/prepare/**', 'docs/building-win.md') }}
          restore-keys: |
            win64-third-party-

      - name: Cache libraries
        uses: actions/cache@v4
        with:
          path: |
            D:\TBuild\Libraries\win64\*
            !D:\TBuild\Libraries\win64\cache_keys
            !D:\TBuild\Libraries\win64\[qQ]t[_-]*
            D:\TBuild\Libraries\win64\cache_keys\*
            !D:\TBuild\Libraries\win64\cache_keys\[qQ]t[_-]*
          key: win64-libs-${{ hashFiles('Telegram/build/prepare/**', 'docs/building-win.md') }}
          restore-keys: |
            win64-libs-

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: |
            D:\TBuild\Libraries\win64\[qQ]t[_-]*
            D:\TBuild\Libraries\win64\cache_keys\[qQ]t[_-]*
          key: win64-qt-${{ hashFiles('Telegram/build/prepare/**', 'docs/building-win.md') }}
          restore-keys: |
            win64-qt-

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: NuGet sources
        shell: cmd
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Prepare third-party libraries
        shell: cmd
        run: |
          cd /d %BUILD_PATH%
          tdesktop\Telegram\build\prepare\win.bat silent

      - name: Configure project
        shell: cmd
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if "%TDESKTOP_API_ID%"=="" exit /b 1
          if "%TDESKTOP_API_HASH%"=="" exit /b 1
          cd /d %BUILD_PATH%\tdesktop\Telegram
          configure.bat x64 ^
            -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
            -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
            -D CMAKE_CONFIGURATION_TYPES=Release ^
            -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
            -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=

      - name: Build Telegram (Release)
        shell: cmd
        run: |
          cd /d %BUILD_PATH%\tdesktop\out
          cmake --build . --config Release --target Telegram --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-x64
          path: D:\TBuild\tdesktop\out\Release\Telegram.exe
          if-no-files-found: error
          compression-level: 0
