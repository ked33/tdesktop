name: Build Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 720

    env:
      BUILD_PATH: D:\TBuild

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare build folders
        shell: pwsh
        run: |
          # 强制创建目录并忽略已存在的错误
          New-Item -ItemType Directory -Force -Path "$env:BUILD_PATH\ThirdParty" | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:BUILD_PATH\Libraries" | Out-Null
          # 复制源码到编译路径
          Copy-Item -Path "$env:GITHUB_WORKSPACE" -Destination "$env:BUILD_PATH\tdesktop" -Recurse

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare third-party libraries
        shell: cmd
        run: |
          cd /d %BUILD_PATH%
          tdesktop\Telegram\build\prepare\win.bat

      - name: Configure project
        shell: cmd
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          if "%TDESKTOP_API_ID%"=="" (echo API_ID is missing && exit /b 1)
          if "%TDESKTOP_API_HASH%"=="" (echo API_HASH is missing && exit /b 1)
          cd /d %BUILD_PATH%\tdesktop\Telegram
          configure.bat x64 -D TDESKTOP_API_ID=%TDESKTOP_API_ID% -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH%

      - name: Build Telegram (Release)
        shell: cmd
        run: |
          cd /d %BUILD_PATH%\tdesktop\out
          :: 方案一：去掉 --target Telegram，默认构建所有必要目标（含 Updater）
          :: --parallel 使用所有可用核心加速
          cmake --build . --config Release --parallel

      - name: Package artifacts
        shell: pwsh
        run: |
          $outDir = "$env:BUILD_PATH\tdesktop\out\Release"
          $pkgDir = "$env:BUILD_PATH\tdesktop\out\artifacts"
          
          # 调试：列出生成的文件，防止路径不对
          Write-Host "Checking build output in $outDir..."
          Get-ChildItem -Path $outDir
          
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          
          # 复制生成的文件到打包目录
          Copy-Item -Path "$outDir\Telegram.exe" -Destination $pkgDir
          Copy-Item -Path "$outDir\Updater.exe" -Destination $pkgDir
          
          # 压缩
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "$env:BUILD_PATH\tdesktop\out\Telegram-x64.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-x64
          path: |
            D:\TBuild\tdesktop\out\artifacts\Telegram.exe
            D:\TBuild\tdesktop\out\artifacts\Updater.exe
            D:\TBuild\tdesktop\out\Telegram-x64.zip
          if-no-files-found: error
