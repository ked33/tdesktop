version: 2.1

jobs:
  build-win-x64:
    machine:
      image: 'windows-server-2022-gui:current'
      shell: 'powershell.exe -ExecutionPolicy Bypass'
    resource_class: windows.large
    working_directory: 'C:\Users\circleci\project\TBuild\C1og-tdesktop'
    environment:
      BUILD_ROOT: 'C:\Users\circleci\project\TBuild'
      REPO_ROOT: 'C:\Users\circleci\project\TBuild\C1og-tdesktop'
      THIRD_PARTY_PATH: 'C:\Users\circleci\project\TBuild\ThirdParty'
      LIBRARIES_PATH: 'C:\Users\circleci\project\TBuild\Libraries\win64'

    steps:
      - run:
          name: Prepare directories
          command: |
            New-Item -ItemType Directory -Force -Path $env:BUILD_ROOT | Out-Null
            New-Item -ItemType Directory -Force -Path $env:THIRD_PARTY_PATH | Out-Null
            New-Item -ItemType Directory -Force -Path $env:LIBRARIES_PATH | Out-Null

      - checkout:
          method: full

      - run:
          name: Sync submodules
          command: |
            git submodule sync --recursive
            git submodule update --init --recursive --jobs 4

      - restore_cache:
          keys:
            - win64-third-party-v1-{{ checksum "Telegram/build/prepare/prepare.py" }}-{{ checksum "Telegram/build/qt_version.py" }}-{{ checksum "docs/building-win.md" }}-{{ checksum ".gitmodules" }}
            - win64-third-party-v1-

      - restore_cache:
          keys:
            - win64-libraries-v1-{{ checksum "Telegram/build/prepare/prepare.py" }}-{{ checksum "Telegram/build/qt_version.py" }}-{{ checksum "docs/building-win.md" }}-{{ checksum ".gitmodules" }}
            - win64-libraries-v1-

      - run:
          name: Probe toolchain
          command: |
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              & $vswhere -latest -products * -format json
            }
            if (Get-Command py -ErrorAction SilentlyContinue) {
              & py --list
            }
            if (Get-Command python -ErrorAction SilentlyContinue) {
              & python --version
            }

      - run:
          name: Ensure Python 3.10
          command: |
            $hasPython310 = $false
            if (Get-Command py -ErrorAction SilentlyContinue) {
              try {
                & py -3.10 --version
                if ($LASTEXITCODE -eq 0) {
                  $hasPython310 = $true
                }
              } catch {
              }
            }
            if (-not $hasPython310) {
              choco install python --version=3.10.11 --force -y /norestart
            }
            $machinePath = [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [System.Environment]::GetEnvironmentVariable('Path', 'User')
            if ($machinePath) {
              $env:Path = $machinePath
            }
            if ($userPath) {
              $env:Path = "$env:Path;$userPath"
            }
            & py -3.10 --version

      - run:
          name: Preflight Windows toolchain
          command: |
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (-not (Test-Path $vswhere)) {
              throw "vswhere.exe not found: $vswhere"
            }

            $installPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1).Trim()
            if (-not $installPath) {
              throw "Visual Studio with VC tools not found."
            }

            $vcvarsPath = Join-Path $installPath 'VC\Auxiliary\Build\vcvars64.bat'
            if (-not (Test-Path $vcvarsPath)) {
              throw "vcvars64.bat not found: $vcvarsPath"
            }

            $msvcRoot = Join-Path $installPath 'VC\Tools\MSVC'
            $toolsets = @()
            if (Test-Path $msvcRoot) {
              $toolsets = Get-ChildItem -Path $msvcRoot -Directory | Select-Object -ExpandProperty Name
            }

            Write-Host "VS install path: $installPath"
            Write-Host "vcvars path: $vcvarsPath"
            Write-Host "Installed MSVC toolsets: $($toolsets -join ', ')"

            if (-not ($toolsets | Where-Object { $_ -like '14.44*' })) {
              throw "MSVC 14.44 toolset not found on this CircleCI image. This repo's docs/building-win.md currently requires -vcvars_ver=14.44."
            }

            if (-not (Get-Command py -ErrorAction SilentlyContinue)) {
              throw "Python launcher 'py' not found on PATH."
            }
            & py -3.10 --version
            if ($LASTEXITCODE -ne 0) {
              throw "Python 3.10 launcher entry is not available."
            }

            if (-not (Get-Command nuget -ErrorAction SilentlyContinue)) {
              throw "nuget not found on PATH."
            }
            & where.exe nuget

      - run:
          name: Prepare third-party libraries
          shell: cmd.exe
          no_output_timeout: 90m
          command: |
            @echo OFF
            setlocal
            call :init_msvc
            if errorlevel 1 exit /b %errorlevel%
            call :use_python310
            if errorlevel 1 exit /b %errorlevel%
            where nuget
            if errorlevel 1 exit /b 1
            nuget sources Disable -Name "Microsoft Visual Studio Offline Packages" >nul 2>&1
            nuget sources Add -Name "NuGet.org" -Source https://api.nuget.org/v3/index.json >nul 2>&1
            cd /d %BUILD_ROOT%
            call %REPO_ROOT%\Telegram\build\prepare\win.bat silent
            exit /b %errorlevel%

            :init_msvc
            set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
            if not exist "%VSWHERE%" exit /b 1
            for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALLPATH=%%i"
            if not defined VSINSTALLPATH exit /b 1
            if not exist "%VSINSTALLPATH%\VC\Auxiliary\Build\vcvars64.bat" exit /b 1
            call "%VSINSTALLPATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
            exit /b %errorlevel%

            :use_python310
            for /f "usebackq delims=" %%i in (`py -3.10 -c "import sys; print(sys.executable)"`) do set "PYTHON310=%%i"
            if not defined PYTHON310 exit /b 1
            for %%i in ("%PYTHON310%") do set "PYTHON310_DIR=%%~dpi"
            set "PATH=%PYTHON310_DIR%;%PYTHON310_DIR%Scripts;%PATH%"
            python --version
            exit /b %errorlevel%

      - save_cache:
          key: win64-third-party-v1-{{ checksum "Telegram/build/prepare/prepare.py" }}-{{ checksum "Telegram/build/qt_version.py" }}-{{ checksum "docs/building-win.md" }}-{{ checksum ".gitmodules" }}
          paths:
            - 'C:\Users\circleci\project\TBuild\ThirdParty'

      - save_cache:
          key: win64-libraries-v1-{{ checksum "Telegram/build/prepare/prepare.py" }}-{{ checksum "Telegram/build/qt_version.py" }}-{{ checksum "docs/building-win.md" }}-{{ checksum ".gitmodules" }}
          paths:
            - 'C:\Users\circleci\project\TBuild\Libraries\win64'

      - run:
          name: Configure and build Telegram
          shell: cmd.exe
          no_output_timeout: 120m
          command: |
            @echo OFF
            setlocal
            if "%TDESKTOP_API_ID%"=="" exit /b 1
            if "%TDESKTOP_API_HASH%"=="" exit /b 1
            call :init_msvc
            if errorlevel 1 exit /b %errorlevel%
            call :use_python310
            if errorlevel 1 exit /b %errorlevel%
            cd /d %REPO_ROOT%\Telegram
            call configure.bat x64 ^
              -D TDESKTOP_API_ID=%TDESKTOP_API_ID% ^
              -D TDESKTOP_API_HASH=%TDESKTOP_API_HASH% ^
              -D CMAKE_CONFIGURATION_TYPES=Release ^
              -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF ^
              -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=
            if errorlevel 1 exit /b %errorlevel%
            cd /d %REPO_ROOT%\out
            cmake --build . --config Release --target Telegram --parallel
            exit /b %errorlevel%

            :init_msvc
            set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
            if not exist "%VSWHERE%" exit /b 1
            for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALLPATH=%%i"
            if not defined VSINSTALLPATH exit /b 1
            if not exist "%VSINSTALLPATH%\VC\Auxiliary\Build\vcvars64.bat" exit /b 1
            call "%VSINSTALLPATH%\VC\Auxiliary\Build\vcvars64.bat" -vcvars_ver=14.44
            exit /b %errorlevel%

            :use_python310
            for /f "usebackq delims=" %%i in (`py -3.10 -c "import sys; print(sys.executable)"`) do set "PYTHON310=%%i"
            if not defined PYTHON310 exit /b 1
            for %%i in ("%PYTHON310%") do set "PYTHON310_DIR=%%~dpi"
            set "PATH=%PYTHON310_DIR%;%PYTHON310_DIR%Scripts;%PATH%"
            python --version
            exit /b %errorlevel%

      - run:
          name: Locate Telegram.exe artifact
          command: |
            $outDir = Join-Path $env:REPO_ROOT 'out'
            if (-not (Test-Path $outDir)) {
              throw "Build output directory not found: $outDir"
            }

            Write-Host "Listing executable files under $outDir"
            $executables = Get-ChildItem -Path $outDir -Recurse -File -Filter *.exe
            if (-not $executables) {
              throw "No .exe files found under $outDir"
            }
            $executables | Select-Object FullName, Length | Format-Table -AutoSize

            $artifactSource = $executables |
              Where-Object { $_.Name -ieq 'Telegram.exe' } |
              Sort-Object FullName |
              Select-Object -First 1
            if (-not $artifactSource) {
              throw "Telegram.exe was not found under $outDir"
            }

            $artifactDir = Join-Path $env:REPO_ROOT 'ci-artifacts'
            New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

            $artifactPath = Join-Path $artifactDir 'Telegram.exe'
            Copy-Item -LiteralPath $artifactSource.FullName -Destination $artifactPath -Force

            Write-Host "Selected artifact source: $($artifactSource.FullName)"
            Write-Host "Prepared artifact path: $artifactPath"

      - store_artifacts:
          path: 'C:\Users\circleci\project\TBuild\C1og-tdesktop\ci-artifacts\Telegram.exe'
          destination: Telegram-x64/Telegram.exe

workflows:
  build-win-x64:
    jobs:
      - build-win-x64
